services:
  - type: web
    name: hr-tech-advisor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m database.init_db && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: hr-tech-advisor-db
          property: connectionString
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TLS
        value: "True"

  - type: web
    name: hr-tech-advisor-web
    runtime: python
    rootDir: frontend/django_app
    buildCommand: pip install -r ../../requirements.txt
    startCommand: python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: hr-tech-advisor-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: hr-tech-advisor-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://hr-tech-advisor-web.onrender.com
      - key: FASTAPI_BASE_URL
        value: https://hr-tech-advisor-api.onrender.com

databases:
  - name: hr-tech-advisor-db
    databaseName: hr_tech_advisor
    user: hr_tech_advisor
